<style>
:root{
  --ivory:#fffaf0;
  --cream:#fff3da;
  --champagne:#f8e2b0;
  --gold:#c8962e;
  --gold-deep:#9a6a12;
  --ink:#4a3418;
  --ink-soft:#8a6c3e;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --side:max(20px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#fbeac4}
body{
  margin:0;
  min-height:calc(100svh + 2px);
  color:var(--ink);
  font-family:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(120% 60% at 50% 0%,#fffdf6 0%,rgba(255,253,246,0) 60%),
    linear-gradient(180deg,#fff7e4 0%,#fbe9bf 55%,#f6d99b 100%);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding:calc(var(--safe-t) + 10px) var(--side) 10px;
  background:rgba(255,246,224,.72);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid rgba(200,150,46,.22);
}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}
.brand a{display:block;line-height:0;border-radius:11px;box-shadow:0 4px 12px rgba(154,106,18,.28)}
.brand img{width:38px;height:38px;border-radius:11px;object-fit:cover}
.brand h1{
  margin:0;font-size:25px;font-weight:800;letter-spacing:.02em;line-height:1;
  font-family:"Avenir Next Condensed","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color:var(--ink);
}
.brand h1 span{color:var(--gold)}

.brand h1 a.home{color:inherit;text-decoration:none;cursor:pointer}
.brand h1 a.home:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:6px}
.lang{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,250,240,.85);border:1px solid rgba(200,150,46,.38);box-shadow:inset 0 1px 0 #fff}
.lang button{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 8px;border:0;border-radius:999px;background:transparent;color:var(--ink-soft);font:700 12.5px/1 inherit;font-family:inherit;letter-spacing:.04em;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s}
.lang button svg{width:20px;height:14px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(74,52,24,.18)}
.lang button[aria-pressed="true"]{background:linear-gradient(145deg,#ebb84f,#c8962e);color:#fff;box-shadow:0 3px 8px rgba(154,106,18,.35)}
.lang button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:360px){.brand{gap:8px}.brand img{width:32px;height:32px}.brand h1{font-size:22px}.lang button{padding:0 8px 0 6px;font-size:12px}}

/* ---------- stage ---------- */
main{
  min-height:calc(100svh + 24px);
  padding:calc(var(--safe-t) + 78px) var(--side) calc(48px + var(--safe-b));
}
.frame{position:relative;width:min(100%,440px);margin:0 auto;container-type:inline-size}
.device{
  position:relative;width:100%;
  aspect-ratio:572/1024;border-radius:26px;overflow:hidden;
  background:#4a8fc0;
  box-shadow:0 22px 50px rgba(154,106,18,.30),0 4px 12px rgba(154,106,18,.18);
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.device img.shot{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);
  pointer-events:none;-webkit-user-drag:none;
}
#i2{z-index:1}
#i3{z-index:2}
#i1{z-index:3}
.device[data-state="0"] #i1{opacity:1}
.device[data-state="1"] #i2{opacity:1}
.device[data-state="1"] #i1{opacity:0;transform:scale(1.07) translateY(5%)}
.device[data-state="2"] #i2,
.device[data-state="2"] #i3{opacity:1}
.device[data-state="2"] #i1{opacity:0;transform:scale(1.07) translateY(5%)}
.device[data-state="0"]:active #i1{transform:scale(.99)}

/* overlay (hubs + LED meter), same box as the photo */
.overlay{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity .6s ease .5s;pointer-events:none}
.device[data-state="2"] .overlay{opacity:1}
.hubpos{position:absolute;width:2.9%;aspect-ratio:1;transform:translate(-50%,-50%)}
.hubpos svg{display:block;width:100%;height:100%;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.device[data-deck="L"] .hubL svg,
.device[data-deck="R"] .hubR svg{
  animation:spin 1.15s linear infinite;animation-play-state:paused;
}
.device.playing .hubL svg,
.device.playing .hubR svg{animation-play-state:running}
/* fast forward / rewind: hubs whirl fast, backwards when rewinding */
.device.ff .hubL svg,.device.ff .hubR svg,
.device.rw .hubL svg,.device.rw .hubR svg{animation:spin .16s linear infinite;animation-play-state:running}
.device.rw .hubL svg,.device.rw .hubR svg{animation-direction:reverse}
#eq{
  position:absolute;opacity:0;transition:opacity .25s ease;border-radius:2px;
}
#eq{left:30.8%;top:50.4%;width:14.7%;height:2.55%;image-rendering:pixelated}
/* album cover from the Internet Archive, standing on top of the player */
.cover{
  position:absolute;left:31%;width:38%;bottom:60%;aspect-ratio:1;object-fit:cover;
  border-radius:3px;background:#1d1b19;pointer-events:none;-webkit-user-drag:none;
  box-shadow:0 0 0 3px #fffaf0,0 8px 16px rgba(20,40,70,.40);
  opacity:0;transform:translateY(12px) scale(.96);
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1);
}
.cover.on{opacity:1;transform:none}
#eq.on{opacity:1}

/* ---------- info panel ---------- */
.panel{width:min(100%,440px);margin:18px auto 0}
.card{
  position:relative;padding:10px 14px 13px;border-radius:18px;
  background:rgba(255,251,240,.9);
  border:1px solid rgba(200,150,46,.38);
  box-shadow:0 8px 22px rgba(154,106,18,.16),inset 0 1px 0 #fff;
}
.bar{height:16px;margin:-4px 0 4px;cursor:pointer;display:flex;align-items:center;touch-action:manipulation}
.bar i{display:block;position:relative;overflow:hidden;width:100%;height:3px;border-radius:2px;background:rgba(200,150,46,.28)}
.bar b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);border-radius:2px}
.l1,.l2{font-size:14px;line-height:1.5;color:var(--ink-soft);overflow-wrap:anywhere}
.l1{display:flex;flex-wrap:nowrap;align-items:baseline;white-space:nowrap;overflow-wrap:normal;min-width:0}
.l1 .timer,.l1 .dot{flex:none}
.l1 .album,.l1 .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.l1 .album{flex:0 1 auto}
.l1 .ttl{flex:1 1 0;min-width:30%}
.l1 .timer{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.l1 .ttl{color:var(--ink);font-weight:700}
.dot{margin:0 6px;opacity:.55}
.album:empty,.album:empty + .dot{display:none}
.l2{margin-top:1px}
.l2[hidden]{display:none}
.l2 a{color:var(--gold-deep);font-weight:600;text-decoration:none}
.l2 a:hover{text-decoration:underline}
.card.loading .ttl{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.searchrow{display:flex;gap:10px;align-items:center;margin-top:12px}
.searchrow form{flex:1;display:flex;gap:10px;align-items:center;min-width:0;margin:0}
.searchrow input{
  flex:1;min-width:0;height:48px;padding:0 18px;border-radius:24px;
  border:1px solid rgba(200,150,46,.42);background:rgba(255,252,244,.95);
  color:var(--ink);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;
}
.searchrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,46,.22)}
.searchrow input::placeholder{color:#a58a5d}
.rbtn{
  flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  border:1px solid rgba(200,150,46,.45);background:#fffaf0;color:var(--gold-deep);
}
.rbtn.wa{width:50px;height:50px;border:0;background:#25d366;color:#fff;box-shadow:0 8px 18px rgba(37,211,102,.38)}
.rbtn svg{width:20px;height:20px;display:block}
.rbtn.wa svg{width:28px;height:28px;fill:currentColor}
.rbtn:active{transform:scale(.93)}
.rbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- controls: floating on the photo, spaced apart ---------- */
.controls{
  --b:38px;
  position:absolute;right:12px;bottom:12px;z-index:6;
  display:flex;flex-direction:column;align-items:flex-end;gap:9px;
  opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .5s ease .6s,transform .5s cubic-bezier(.2,.8,.2,1) .6s;
}
@supports (width:1cqw){.controls{--b:clamp(30px,calc((100cqw - 24px - 48px)/7),42px)}}
.controls .row{display:flex;gap:8px}
body.active .controls{opacity:1;transform:none}
body.active .controls button{pointer-events:auto}
.controls button{
  width:var(--b);height:var(--b);border-radius:50%;
  display:grid;place-items:center;padding:0;cursor:pointer;
  color:var(--gold-deep);touch-action:manipulation;
  background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,238,198,.75));
  -webkit-backdrop-filter:blur(14px) saturate(1.5);
  backdrop-filter:blur(14px) saturate(1.5);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 6px 16px rgba(60,40,10,.30),inset 0 1px 0 #fff,inset 0 -2px 5px rgba(200,150,46,.2);
  transition:transform .15s ease,box-shadow .15s ease;
}
.controls button.main{color:#fff;background:linear-gradient(145deg,#ebb84f,#c8962e);border-color:rgba(255,255,255,.8)}
.controls button:active{transform:scale(.9)}
.controls svg{width:calc(var(--b)*.5);height:calc(var(--b)*.5);fill:currentColor;display:block}
.controls button:focus-visible,.sheet li button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- genre sheet ---------- */
.backdrop{
  position:fixed;inset:0;z-index:40;background:rgba(120,80,20,.28);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-height:80svh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fffaf0,#fdeec9);
  border-radius:26px 26px 0 0;
  box-shadow:0 -18px 50px rgba(154,106,18,.3);
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  padding-bottom:var(--safe-b);
}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(200,150,46,.45);margin:10px auto 4px}
.sheet h2{margin:6px 0 8px;text-align:center;font-size:17px;font-weight:700}
.sheet ul{list-style:none;margin:0;padding:0 var(--side) 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet li button{
  width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid rgba(200,150,46,.2);
  padding:15px 4px;cursor:pointer;display:flex;align-items:center;gap:12px;
}
.sheet li button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--champagne);border:1px solid var(--gold);flex:none}
.sheet li button.cur{font-weight:700}
.sheet li button.cur::before{background:var(--gold)}
.sheet li button:active{background:rgba(248,226,176,.55)}

@media (prefers-reduced-motion:reduce){
  .device img.shot,.controls,.sheet,.overlay{transition-duration:.01s}
  .card.loading .ttl{animation:none}
}

/* ---------- PWA install (discreet) ---------- */
.installrow{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px}
.installrow[hidden],.installrow [hidden]{display:none}
.installbtn{
  font:inherit;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--gold-deep);
  background:rgba(255,251,240,.9);border:1px solid rgba(200,150,46,.42);border-radius:999px;
  padding:8px 18px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 4px 12px rgba(154,106,18,.14),inset 0 1px 0 #fff;
}
.installbtn:active{transform:scale(.96)}
.installbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ioshint{margin:0;max-width:34ch;text-align:center;font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
</style>
</head>

}
function tone(c,t,dur,type,f0,f1,vol){
  var o=c.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=c.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}
function sfxUnbox(){
  var c=audioCtx(); if(!c) return; var t=c.currentTime;
  noise(c,t,0.45,1800,350,1.2,0.5);          // cardboard rasp
  noise(c,t+0.12,0.25,3200,900,2,0.25);
  tone(c,t+0.42,0.22,"sine",120,48,0.7);     // thump on the table
  noise(c,t+0.42,0.08,600,300,1,0.4);
}
function sfxPower(){
  var c=audioCtx(); if(!c) return; var t=c.currentTime;
  tone(c,t,0.03,"square",1900,900,0.2);      // relay click
  noise(c,t,0.05,2500,1500,3,0.35);
  tone(c,t+0.06,0.5,"sine",55,140,0.35);     // power hum rising
  tone(c,t+0.1,0.45,"triangle",110,280,0.12);
  tone(c,t+0.42,0.03,"square",1500,700,0.18);

}
function sfxBtn(){

/* ================= EQ: real spectrum analysis of the playing track ================= */
var COLS=10, ROWS=9, lv=[], tg=[], eqRAF=0;
for(var i=0;i<COLS;i++){lv.push(0.05);tg.push(Math.random())}
var analyser=null, srcNode=null, freqData=null, bandEdges=null;

function ensureAnalyser(){
  if(srcNode) return;
  var c=audioCtx(); if(!c||c.state!=="running") return;
  try{
    var s=c.createMediaElementSource(audio);
    var a=c.createAnalyser();
    a.fftSize=2048; a.smoothingTimeConstant=0.5; a.minDecibels=-90; a.maxDecibels=-25;
    s.connect(a); a.connect(c.destination);
    var binHz=c.sampleRate/a.fftSize, edges=[];
    for(var i=0;i<=COLS;i++){
      var f=50*Math.pow(14000/50,i/COLS);          // 10 log-spaced bands, 50 Hz - 14 kHz
      edges.push(Math.max(1,Math.round(f/binHz)));
    }
    bandEdges=edges; freqData=new Uint8Array(a.frequencyBinCount);
    srcNode=s; analyser=a;
  }catch(e){srcNode=null;analyser=null}
}
function readBands(){
  analyser.getByteFrequencyData(freqData);
  for(var i=0;i<COLS;i++){
    var lo=bandEdges[i], hi=Math.max(lo+1,bandEdges[i+1]), sum=0, mx=0;
    for(var k=lo;k<hi;k++){var v=freqData[k]; sum+=v; if(v>mx) mx=v}
    var raw=0.55*(sum/(hi-lo)/255)+0.45*(mx/255);
    var v2=(raw-0.3)/0.62+i*0.02;                  // noise floor + gentle treble tilt
    tg[i]=Math.max(0,Math.min(1,v2));
  }
}
function drawEQ(){
  var W=eqCanvas.width,H=eqCanvas.height;
  eqCtx.fillStyle="#231d17"; eqCtx.fillRect(0,0,W,H);
  var cw=W/COLS, gap=3, sh=H/ROWS;
  for(var c=0;c<COLS;c++){
    var lit=Math.round(lv[c]*ROWS);
    for(var r=0;r<ROWS;r++){
      var on=r<lit, y=H-(r+1)*sh;
      eqCtx.fillStyle = r>=7 ? (on?"#ff5b3a":"#3d2522") : r>=5 ? (on?"#e9f23a":"#3d371e") : (on?"#7dff3c":"#3a301f");
      eqCtx.fillRect(c*cw+gap/2,y+1,cw-gap,sh-1.5);
    }
  }
}
function eqStep(){
  if(analyser) readBands();
  else for(var i=0;i<COLS;i++){ if(Math.random()<0.22) tg[i]=Math.random()*Math.random()*0.4+Math.random()*0.65 }
  for(var j=0;j<COLS;j++){
    var t=tg[j];
    lv[j]= t>lv[j] ? lv[j]+(t-lv[j])*0.7 : Math.max(t,lv[j]-0.06);   // fast attack, falling decay
  }
  drawEQ();
  eqRAF=requestAnimationFrame(eqStep);
}
function startEQ(){ eqCanvas.classList.add("on"); if(!eqRAF) eqRAF=requestAnimationFrame(eqStep); }
function stopEQ(){ if(eqRAF){cancelAnimationFrame(eqRAF);eqRAF=0} }   // frozen on last frame
drawEQ();

/* ================= ARCHIVE.ORG ================= */
function fetchJSON(url,ms){
  var ctl=("AbortController" in window)?new AbortController():null;
  var to=setTimeout(function(){ctl&&ctl.abort()},ms||12000);
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){
    clearTimeout(to);
    if(!r.ok) throw new Error("http "+r.status);
    return r.json();
  });
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clean(s){return String(s).replace(/["\\]/g," ")}
function adv(q,rows,page,sort){
  var u="https://archive.org/advancedsearch.php?q="+encodeURIComponent(q)+
    "&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=downloads&fl[]=mediatype&rows="+rows+"&page="+page+"&output=json"+
    (sort?"&sort[]="+encodeURIComponent(sort):"");
  return fetchJSON(u).then(function(j){return (j.response&&j.response.docs)||[]});
}
function randomItemFromCollection(id){
  var page=1+Math.floor(Math.random()*3);
  return adv("collection:"+id+" AND mediatype:audio",40,page,"downloads desc").then(function(d){
    if(d.length) return pick(d);
    return adv("collection:"+id+" AND mediatype:audio",40,1,"downloads desc").then(function(d2){
      if(!d2.length) throw new Error("empty collection");
      return pick(d2);
    });
  });
}
function itemFromPool(){
  var name=pick(CLASSICAL_POOL);
  return adv('title:("'+clean(name)+'") AND (mediatype:audio OR mediatype:collection)',5,1,"downloads desc").then(function(d){
    if(!d.length) return itemFromKeywords(["classical"]);
    var best=d[0];
    return best.mediatype==="collection" ? randomItemFromCollection(best.identifier) : best;
  });
}
function itemFromKeywords(keys){
  var kw=clean(pick(keys));
  var base='mediatype:audio AND subject:("'+kw+'")';
  var page=1+Math.floor(Math.random()*8);
  return adv(base+" AND downloads:[50 TO *]",40,page,"downloads desc").then(function(d){
    if(d.length) return pick(d);
    return adv(base,40,1,"downloads desc").then(function(d2){
      if(!d2.length) throw new Error("no items");
      return pick(d2);
    });
  });
}
function albumFromItem(item){
  return fetchJSON("https://archive.org/metadata/"+encodeURIComponent(item.identifier),15000).then(function(m){
    if(m.is_dark) throw new Error("dark item");
    var files=(m.files||[]).filter(function(f){
      if(!/\.(mp3|ogg|m4a|flac)$/i.test(f.name)) return false;
      if(/sample|preview|_spectrogram/i.test(f.name)) return false;
      if(f.size && Number(f.size)>60*1024*1024) return false;
      return true;
    });
    var lowq=files.filter(function(f){return !/_(32|64|128)kb\.mp3$/i.test(f.name)});
    if(lowq.length) files=lowq;
    var mp3=files.filter(function(f){return /\.mp3$/i.test(f.name)});
    var ogg=files.filter(function(f){return /\.ogg$/i.test(f.name)});
    if(mp3.length) files=mp3; else if(ogg.length) files=ogg;   // avoid duplicate formats
    if(!files.length) throw new Error("no audio files");
    files.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
    var title=(m.metadata&&m.metadata.title)||item.title||item.identifier;
    if(Array.isArray(title)) title=title[0];
    var id=item.identifier;
    var creator=m.metadata&&m.metadata.creator;
    if(Array.isArray(creator)) creator=creator.join(", ");
    return {
      id:id, title:title, creator:creator||"",
      files:files.map(function(f){
        return {
          name:f.name,
          url:"https://archive.org/download/"+encodeURIComponent(id)+"/"+f.name.split("/").map(encodeURIComponent).join("/"),
          title:(f.title||f.name.replace(/^.*\//,"").replace(/\.[a-z0-9]+$/i,"").replace(/_+/g," ")).trim()
        };
      })
    };
  });
}
function pickAlbum(){
  var g=currentGenre;
  var p=(!g||g.pool)?itemFromPool():itemFromKeywords(g.k);
  return p.then(albumFromItem);
}

/* ================= LOAD / PLAY ================= */
var loading=false, corsFails=0, album=null, idx=0;
function playUrl(url,cors){
  if(cors) audio.crossOrigin="anonymous"; else audio.removeAttribute("crossorigin");
  audio.src=url;
  var p=audio.play();
  return (p&&p.then)?p:Promise.resolve();
}
function coverUrl(id){ return "https://archive.org/services/img/"+encodeURIComponent(id); }
function setCover(a){
  if(!a||!a.id||coverId===a.id) return;
  coverId=a.id;
  cover.classList.remove("on");
  cover.onload=function(){ if(coverId===a.id) cover.classList.add("on"); };
  cover.onerror=function(){ if(coverId===a.id) cover.classList.remove("on"); };
  cover.src=coverUrl(a.id);
}
function startTrack(my){
  var t=album.files[idx];
  deck=(deck==="L")?"R":"L";               // alternate the spinning hubs on every new track
  device.setAttribute("data-deck",deck);
  hasTrack=true;
  setCover(album);
  setText(t.title,album.title,true);
  updateInfo();
  var cors=srcNode?true:corsFails<2;       // CORS is needed to analyse the sound
  return playUrl(t.url,cors).catch(function(e){
    if(my!==token||(e&&e.name==="NotAllowedError")) throw e;
    if(cors&&!srcNode){ corsFails++; return playUrl(t.url,false); }   // play without analysis
    throw e;
  }).then(function(){
    if(my!==token) return;
    loading=false;
    setText(t.title,album.title,false);
    if("mediaSession" in navigator && window.MediaMetadata){
      navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:album.title,album:"TapePro",artwork:[{src:coverUrl(album.id),sizes:"300x300"}]});
    }
  });
}
/* play a specific track of the current album */
function playIndex(i){
  if(state!==2) return;
  if(!album||i<0||i>=album.files.length) return loadRandomTrack();
  var my=++token; loading=true; idx=i;
  var tries=0;
  (function go(){
    return startTrack(my).catch(function(e){
      if(my!==token) return;
      if(e&&e.name==="NotAllowedError"){ loading=false; setK("press","","",false); return; }
      if(++tries<3 && idx+1<album.files.length){ idx++; return go(); }
      loadRandomTrack();
    });
  })();
}
/* new random album (and a random track in it) from the current genre */
function loadRandomTrack(){
  if(state!==2) return;
  var my=++token;
  loading=true; hasTrack=true;
  setK("tuning","","",true);
  var attempts=0;
  function attempt(){
    attempts++;
    return pickAlbum().then(function(a){
      if(my!==token) return;
      album=a; idx=Math.floor(Math.random()*a.files.length);
      return startTrack(my);
    }).catch(function(e){
      if(my!==token) return;
      if(e && e.name==="NotAllowedError"){ loading=false; setK("press","","",false); return; }
      if(attempts<5) return attempt();
      loading=false; hasTrack=false;
      setK("fail","","",false);
    });
  }
  attempt();
}
function nextTrack(){
  if(state!==2) return;
  if(album && idx+1<album.files.length) playIndex(idx+1); else loadRandomTrack();
}
function prevTrack(){
  if(state!==2||!album||!hasTrack) return;
  if(audio.currentTime>3||idx===0){
    try{audio.currentTime=0}catch(e){}
    if(audio.paused){var p=audio.play(); if(p&&p.catch) p.catch(function(){})}
  }else playIndex(idx-1);
}
function seekBy(sec){
  if(!hasTrack||!audio.src||audio.src.indexOf("data:")===0) return;
  var t=audio.currentTime+sec, d=audio.duration;
  if(t<0) t=0;
  if(isFinite(d)&&t>d-0.3) t=Math.max(0,d-0.3);
  try{audio.currentTime=t}catch(e){}
}
function openTrack(){
  if(!album) return;
  var t=album.files[idx];
  window.open("https://archive.org/details/"+encodeURIComponent(album.id)+"/"+t.name.split("/").map(encodeURIComponent).join("/"),"_blank","noopener");
}
function stopPlayback(){
  token++; loading=false;                   // cancel any pending load
  try{audio.pause()}catch(e){}
  setPlaying(false);
}
function isPlaying(){return device.classList.contains("playing")}

/* ================= INTERACTION ================= */
function activate(){
  state=2; document.body.classList.add("active");
  setK("on","","",false);
}
function onDeviceTap(){
  unlockAudio();
  if(state===0){
    state=1; device.setAttribute("data-state","1"); sfxUnbox();
    setK("again","","",false);
  }else if(state===1){
    state=2; device.setAttribute("data-state","2"); sfxPower();
    activate();
    startShared();
  }else{
    sfxBtn();
    loadRandomTrack();                      // new random track (stops the current one)
  }
}

/* rewind / fast forward: tap = 10 s, hold = keeps scanning */
function seekButton(btn,dir){
  var t1=0,t2=0,fx=0,cls=dir>0?"ff":"rw";
  function fxOn(){ clearTimeout(fx); device.classList.remove(dir>0?"rw":"ff"); device.classList.add(cls); }
  function fxOff(ms){ clearTimeout(fx); fx=setTimeout(function(){ device.classList.remove(cls) },ms); }
  function stop(){ clearTimeout(t1); clearInterval(t2); t1=t2=0; fxOff(450); }
  btn.addEventListener("pointerdown",function(e){
    sfxBtn(); seekBy(dir*10); clearTimeout(t1); clearInterval(t2); fxOn();
    t1=setTimeout(function(){ t2=setInterval(function(){ seekBy(dir*4) },160) },450);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ btn.addEventListener(ev,stop) });
  btn.addEventListener("click",function(e){ if(e.detail===0){ seekBy(dir*10); fxOn(); fxOff(700) } });   // keyboard
}

var timerEl=$("timer"), barFill=$("barFill"), l2=$("l2"), trackNo=$("trackNo"), iaLink=$("iaLink");
function fmt(s){
  s=Math.max(0,Math.floor(s||0));
  var h2=Math.floor(s/3600), m2=Math.floor(s%3600/60), x=s%60;
  return (h2?h2+":"+(m2<10?"0":"")+m2:m2)+":"+(x<10?"0":"")+x;
}
function updateTimer(){
  var d=isFinite(audio.duration)?audio.duration:0, c=audio.currentTime||0;
  if(audio.src.indexOf("data:")===0){d=0;c=0}
  timerEl.textContent=fmt(c)+" / "+fmt(d);
  barFill.style.width=(d?Math.min(100,c/d*100):0)+"%";
}
["timeupdate","loadedmetadata","durationchange","emptied","seeked"].forEach(function(ev){audio.addEventListener(ev,updateTimer)});

var SHARE_BASE="https://easylandx.github.io/tapepro/";
var pendingShare=false, sharedLoading=false, wantShared=false, sharedIdx=0;
(function(){
  var id=null,n=0;
  try{ var qs=new URLSearchParams(location.search); id=qs.get("a"); n=parseInt(qs.get("n"),10); }catch(e){}
  if(!id) return;
  if(!(n>=0)) n=0;
  pendingShare=true; sharedLoading=true;
  albumFromItem({identifier:id,title:id}).then(function(a){
    sharedLoading=false;
    sharedIdx=Math.min(n,a.files.length-1);
    if(state===2&&wantShared){ album=a; idx=sharedIdx; pendingShare=false; wantShared=false; playIndex(idx); return; }
    album=a; idx=sharedIdx; updateInfo();
    if(state===0) setK("sharedTap",a.files[idx].title,"",false);
  }).catch(function(){
    sharedLoading=false; pendingShare=false;
    if(state===2&&wantShared){ wantShared=false; loadRandomTrack(); }
  });
})();
function startShared(){
  if(!pendingShare) return;
  if(sharedLoading){ wantShared=true; setK("loadShared","","",true); return; }
  if(album){ pendingShare=false; playIndex(sharedIdx); }
}

function copyText(s){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      return navigator.clipboard.writeText(s).catch(function(){legacyCopy(s)});
    }
  }catch(e){}
  legacyCopy(s);
}
function legacyCopy(s){
  try{
    var ta=document.createElement("textarea");
    ta.value=s; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,s.length);
    document.execCommand("copy"); document.body.removeChild(ta);
  }catch(e){}
}

var shareBlob=null, shareFile=null, shareImgP=null;
function prepShareImage(){

function openWAApp(enc){
  var fell=setTimeout(function(){

    if(document.hidden){clearTimeout(fell);document.removeEventListener("visibilitychange",once)}
  });
  window.location.href="whatsapp://send?text="+enc;
}

function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()}
function toStr(x){return Array.isArray(x)?x.join(" "):String(x||"")}
function fracTerms(h,words){
  if(!words.length) return 0;
  var n=0; for(var i=0;i<words.length;i++) if(h.indexOf(words[i])>-1) n++;
  return n/words.length;
}

  s+=fracTerms(h,words)*8;
  s+=Math.log10((Number(it.downloads)||0)+1);
  return s;
}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function wpick(list,best){
  var w=list.map(function(c){return Math.pow(c.s/best,3)+0.05});
  var tot=w.reduce(function(a,b){return a+b},0), r=Math.random()*tot;
  for(var i=0;i<list.length;i++){ r-=w[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function noResults(q,my){
  if(my!==token) return;
  loading=false;
  setK("noRes",q,"",false);
}
function searchTrack(raw){
  var q=raw.replace(/[^\p{L}\p{N} ]+/gu," ").replace(/\s+/g," ").trim();
  if(!q) return;
  ensureOn();
  pendingShare=false;
  var phrase=norm(q);
  var all=phrase.split(" ").filter(Boolean);
  var words=all.filter(function(w){return !STOPW[w]});
  if(!words.length) words=all;
  if(!words.length) return;
  var my=++token; loading=true;
  setK("searching",q,"",true);
  var perWord="("+words.map(function(w){return "(title:"+w+" OR creator:"+w+")"}).join(" AND ")+")";
  var AUD=" AND mediatype:audio";
  var rp=function(n){return 1+Math.floor(Math.random()*n)};
  var safe=function(p){return p.catch(function(){return []})};
  Promise.all([
    safe(adv('(title:("'+phrase+'") OR creator:("'+phrase+'"))'+AUD,20,1,"downloads desc")),
    safe(adv(perWord+AUD,20,rp(2),"downloads desc")),
    safe(adv("("+words.join(" AND ")+")"+AUD,20,rp(3),"")),
    safe(adv(perWord+AUD,20,rp(2),"addeddate desc"))
  ]).then(function(res){
    if(my!==token) return;
    var seen={}, items=[];
    res.forEach(function(list){ list.forEach(function(it){
      if(!it.identifier || seen[it.identifier]) return;
      seen[it.identifier]=1; it._s=itemScore(it,phrase,words); items.push(it);
    })});
    if(!items.length) return noResults(q,my);
    items.sort(function(a,b){return b._s-a._s});
    var chosen=items.slice(0,10).concat(shuffle(items.slice(10)).slice(0,2));
    return Promise.all(chosen.map(function(it){
      return albumFromItem(it).then(function(a){a._pop=Math.log10((Number(it.downloads)||0)+1);return a}).catch(function(){return null});
    })).then(function(albums){
      if(my!==token) return;
      albums=albums.filter(Boolean);
      var cands=[];
      albums.forEach(function(a){
        var ah=norm(a.title+" "+a.creator);
        a.files.forEach(function(f,i){
          var h=norm(f.title+" "+f.name);
          var cov=fracTerms(h+" "+ah,words);
          if(cov<0.5) return;
          var s=0;
          if(phrase && h.indexOf(phrase)>-1) s+=14;
          s+=fracTerms(h,words)*10;
          s+=fracTerms(ah,words)*4;
          if(phrase && ah.indexOf(phrase)>-1) s+=3;
          s+=a._pop*0.3;
          cands.push({a:a,i:i,s:s,key:a.id+"|"+i});
        });
      });
      if(!cands.length) return noResults(q,my);
      var best=0; cands.forEach(function(c){if(c.s>best)best=c.s});
      var hist=searchHist[phrase]||(searchHist[phrase]=[]);
      var fresh=function(th){return cands.filter(function(c){return c.s>=best*th && hist.indexOf(c.key)<0})};
      var pool=fresh(0.7);
      if(!pool.length) pool=fresh(0.45);
      if(!pool.length){ hist.length=0; pool=cands.filter(function(c){return c.s>=best*0.7}); }
      var win=wpick(pool,best);
      hist.push(win.key); if(hist.length>60) hist.shift();
      album=win.a; playIndex(win.i);
    });
  }).catch(function(){ noResults(q,my) });
}
$("searchForm").addEventListener("submit",function(e){
  e.preventDefault();
  var inp=$("q"); sfxBtn();
  searchTrack(inp.value);
  inp.blur();
});

/* media-session hardware keys */
if("mediaSession" in navigator){
  try{
    navigator.mediaSession.setActionHandler("play",function(){audio.play()});
    navigator.mediaSession.setActionHandler("pause",function(){audio.pause()});
    navigator.mediaSession.setActionHandler("nexttrack",function(){nextTrack()});
    navigator.mediaSession.setActionHandler("previoustrack",function(){prevTrack()});
    navigator.mediaSession.setActionHandler("seekbackward",function(){seekBy(-10)});
    navigator.mediaSession.setActionHandler("seekforward",function(){seekBy(10)});
  }catch(e){}
}
/* start scrolled to the bottom (controls in view); after that the page scrolls freely */
(function(){
  try{ if("scrollRestoration" in history) history.scrollRestoration="manual"; }catch(e){}
  var free=false;
  function stop(){ free=true; }
  ["touchstart","wheel","pointerdown","keydown"].forEach(function(ev){ window.addEventListener(ev,stop,{passive:true,once:true}); });
  function snap(){
    if(free) return;
    var y=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
    if(Math.abs(window.scrollY-y)<2) return;
    window.scrollTo(0,y);
  }
  snap();
  window.addEventListener("load",function(){ snap(); setTimeout(snap,250); setTimeout(snap,900); });
})();
/* ================= PWA: install button, iOS hint, service worker ================= */
(function(){
  var row=document.getElementById("installRow"), btn=document.getElementById("btnInstall"), hint=document.getElementById("iosHint");
  var standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
  var ua=navigator.userAgent||"";
  var isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var deferred=null;
  if(!standalone){
    if(isIOS){ row.hidden=false; hint.hidden=false; }
    window.addEventListener("beforeinstallprompt",function(e){
      e.preventDefault(); deferred=e; row.hidden=false; btn.hidden=false;
    });
    btn.addEventListener("click",function(){
      if(!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred=null; btn.hidden=true; row.hidden=true; },function(){});
    });
    window.addEventListener("appinstalled",function(){ deferred=null; btn.hidden=true; hint.hidden=true; row.hidden=true; });
  }
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("./tapepro-sw.js").catch(function(){});
    });
  }
})();
/* initial language + opening message */
setK("boxed","","",false);
applyLang();
})();
